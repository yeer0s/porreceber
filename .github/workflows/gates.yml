name: gates

# Every claim the README makes is checked here, on every push, across four
# Python versions and three operating systems. Nobody has to take "zero network
# calls", "two independent implementations" or "the gate knows how to fail" on
# trust — the proofs are jobs.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Monthly. Statutory periods rot without a single line of this repo changing:
    # a law is amended, a captured article is superseded, and the engine keeps
    # answering confidently from a stale table. A scheduled run turns silent
    # decay into a visible red build.
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: No dependencies to install
        run: |
          python -c "import sys; print(sys.version)"
          echo "Standard library only, by design."

      - name: Dual-path crosscheck (1836 combinations)
        run: python scripts/oracle.py --crosscheck

      - name: Mutation test — prove the crosscheck can detect corrupted arithmetic
        run: python scripts/oracle.py --mutation-test

      - name: Declared blind spots
        run: python scripts/oracle.py --blind-spots

      - name: Full gate (28 checks)
        run: python scripts/sweep.py --verboso

      - name: Self-test — prove the gate can go red and recover
        run: python scripts/sweep.py --self-test

      - name: Mutants against the product invariants
        run: python scripts/mutants.py

      - name: Offline audit (AST)
        run: python scripts/offline_audit.py

      - name: Offline audit self-test — prove the audit can fail
        run: python scripts/offline_audit.py --selftest

  no-network:
    name: prove it runs with networking disabled
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The offline audit is static. This is the dynamic counterpart: every
      # socket constructor is poisoned before the engine is imported, so any
      # attempt to reach the network raises instead of succeeding quietly.
      - name: Run the whole gate with sockets disabled
        run: |
          cat > sitecustomize.py <<'PY'
          import socket

          class _Blocked(RuntimeError):
              pass

          def _deny(*a, **k):
              raise _Blocked("network access attempted in an offline-only project")

          socket.socket = _deny
          socket.create_connection = _deny
          socket.socketpair = _deny
          PY
          PYTHONPATH=. python scripts/sweep.py
          PYTHONPATH=. python scripts/oracle.py --crosscheck
          PYTHONPATH=. python scripts/mutants.py

  statute-integrity:
    name: statute captures are complete and cited
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A regime citing an article that is not in assets/law/ is a fabricated
      # citation. The gate covers this, but it is called out as its own job so
      # a failure is legible at a glance rather than buried in 26 lines.
      - name: Every regime cites an article present in the captures
        run: python scripts/sweep.py --verboso
