<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Lei 23/96 artigo 10 - tres mecanismos">
<rect width="900" height="330" fill="#ffffff"/>
<text x="32" y="44" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#1f2328">Lei n.º 23/96, art. 10.º — não é um prazo de seis meses</text>
<text x="32" y="70" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#59636e">São três mecanismos distintos. Colapsá-los num só produz respostas erradas nos dois sentidos.</text>
<g transform="translate(32,96)">
<rect width="836" height="66" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="18" y="28" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#1f2328">n.º 1</text>
<text x="80" y="28" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#1f2328">prescrição do preço do serviço</text>
<text x="80" y="50" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#59636e">arts. 323.º · 325.º · 326.º</text>
<text x="818" y="38" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#1a7f37">INTERROMPE-SE</text>
</g>
<g transform="translate(32,172)">
<rect width="836" height="66" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="18" y="28" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#1f2328">n.º 2</text>
<text x="80" y="28" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#1f2328">caducidade da diferença após pagamento a menos</text>
<text x="80" y="50" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#59636e">art. 328.º</text>
<text x="818" y="38" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#bc4c00">NÃO SE INTERROMPE</text>
</g>
<g transform="translate(32,248)">
<rect width="836" height="66" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="18" y="28" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#1f2328">n.º 4</text>
<text x="80" y="28" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#1f2328">prazo para propor acção ou injunção</text>
<text x="80" y="50" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#59636e">autónomo</text>
<text x="818" y="38" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#59636e">PRAZO PROCESSUAL</text>
</g>
<text x="32" y="342" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#59636e">Reconhecer a dívida reinicia o n.º 1 do zero — e não toca no n.º 2.</text>
</svg>